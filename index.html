<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>⛔ ACCESS DENIED — LOCKED</title>
<style>
:root{--bg:#020403;--g:#18ff7a;--gd:#0c8f46;--tx:#cfe0d6;--dim:#5f7a6b;--warn:#e0a63a;--bad:#ff3b46;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{min-height:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;overflow:hidden;cursor:none;height:100vh}
#rain{position:fixed;inset:0;width:100%;height:100%;z-index:0}
body:after{content:"";position:fixed;inset:0;z-index:1;pointer-events:none;
background:radial-gradient(ellipse at 50% 42%,#020403cc 0,#02040388 38%,transparent 75%),
repeating-linear-gradient(0deg,#00000030 0 1px,transparent 1px 3px)}
#cursor{position:fixed;width:22px;height:22px;border:2px solid var(--bad);border-radius:50%;pointer-events:none;z-index:9999;
transform:translate(-50%,-50%);box-shadow:0 0 14px var(--bad);transition:transform .05s}
#loopBadge{position:fixed;top:10px;left:10px;z-index:9998;font:11px ui-monospace,monospace;color:var(--bad);
background:#000a;padding:6px 10px;border:1px solid #ff3b4655;border-radius:4px;direction:ltr;letter-spacing:1px}
#loopBadge b{color:#fff;font-size:13px}
.wrap{position:relative;z-index:2;max-width:520px;margin:0 auto;height:100vh;overflow:hidden;
padding:calc(26px + env(safe-area-inset-top,0px)) 18px calc(30px + env(safe-area-inset-bottom,0px));
display:flex;flex-direction:column;align-items:center;text-align:center}
.bar{width:100%;display:flex;justify-content:space-between;direction:ltr;font:11px ui-monospace,monospace;color:var(--dim);
padding-bottom:12px;border-bottom:1px solid #18ff7a22}
.bar .st{color:var(--bad)}
.bar .st:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--bad);margin-right:7px;animation:bl 1.2s steps(1) infinite}
h1{font-size:clamp(26px,7vw,34px);line-height:1.5;margin:16px 0 8px;color:#ff3b46;text-shadow:0 0 18px #ff3b4655}
p.lead{line-height:2;font-size:15.5px;max-width:420px}
p.lead b{color:var(--g);font-weight:600}
.loopmeter{width:100%;margin-top:16px;direction:ltr;font:11px ui-monospace,monospace;color:var(--dim)}
.loopmeter .track{height:10px;background:#0a1a12;border:1px solid #18ff7a33;border-radius:3px;overflow:hidden;margin-top:5px}
.loopmeter .fill{height:100%;width:0%;background:linear-gradient(90deg,var(--bad),var(--warn),var(--g));transition:width .15s}
.stats{width:100%;margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;direction:ltr}
.stats .s{background:#03100a;border:1px solid #18ff7a22;border-radius:4px;padding:8px;font:10px ui-monospace,monospace;color:var(--dim)}
.stats .s b{display:block;color:var(--g);font-size:16px;margin-bottom:2px}
.term{width:100%;margin-top:16px;background:#030806e6;border:1px solid #18ff7a33;border-radius:4px;direction:ltr;text-align:left;
box-shadow:0 0 30px #18ff7a12;flex:1;min-height:0;display:flex;flex-direction:column}
.term .h{padding:8px 13px;border-bottom:1px solid #18ff7a22;font:11px ui-monospace,monospace;color:var(--dim);
display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.term .h .dots{display:flex;gap:5px}.term .h .dots i{width:9px;height:9px;border-radius:50%;background:#ff5f57;display:block}
.term .h .dots i:nth-child(2){background:#febc2e}.term .h .dots i:nth-child(3){background:#28c840}
.log{padding:13px;font:11px/1.7 ui-monospace,monospace;color:var(--dim);overflow-y:auto;overflow-wrap:anywhere;flex:1;min-height:0}
.log::-webkit-scrollbar{width:5px}.log::-webkit-scrollbar-thumb{background:#18ff7a44;border-radius:3px}
.log div{opacity:0}.log div.on{opacity:1}
.log .t{color:#3c5547}.log .ok{color:var(--g)}.log .w{color:var(--warn)}.log .b{color:var(--bad)}
.cur:after{content:"";display:inline-block;width:6px;height:11px;background:var(--g);margin-left:4px;vertical-align:-2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
</style>
</head>
<body>
<div id="cursor"></div>
<div id="loopBadge">LOOP <b id="loopNum">0</b> / ∞</div>
<canvas id="rain" aria-hidden="true"></canvas>
<main class="wrap">
 <div class="bar"><span>edu-platform // security</span><span class="st">INTRUSION LOGGED</span></div>
 <h1 style="margin-top:30px">⛔ وصول غير مصرّح به</h1>
 <p class="lead">انت داخل <b>لوب مغلق</b>. كل ثانية بتقربك من إعادة التعيين، ومفيش خروج.</p>
 <div class="loopmeter">
   <span>LOOP PROGRESS <span id="loopPct" style="color:var(--g)">0%</span></span>
   <div class="track"><div class="fill" id="loopFill"></div></div>
 </div>
 <div class="stats">
   <div class="s"><b id="statTime">00:00</b>session</div>
   <div class="s"><b id="statTry">0</b>escapes</div>
   <div class="s"><b id="statRel">0</b>reloads</div>
 </div>
 <section class="term"><div class="h"><span>root@platform:~# loop --forever</span><span class="dots"><i></i><i></i><i></i></span></div><div class="log" id="log"></div></section>
</main>
<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const safe = fn => { try{ fn(); }catch(e){} };

/* ============================================================
   LOOP ENGINE — 5 طبقات متزامنة، كل واحدة بتعيد التانية
   ============================================================ */

/* --- حالة اللوب (بتفضل عايشة عبر reloads) --- */
const LK = 'loop_state_v1';
function getState(){
  try{ return JSON.parse(sessionStorage.getItem(LK)) || {cycle:0, tries:0, born:Date.now(), reloads:0}; }
  catch(e){ return {cycle:0, tries:0, born:Date.now(), reloads:0}; }
}
function setState(s){ safe(()=> sessionStorage.setItem(LK, JSON.stringify(s))); }
let S = getState();
S.reloads++;
setState(S);

/* --- عناصر الواجهة --- */
const loopNum=$('#loopNum'), loopFill=$('#loopFill'), loopPct=$('#loopPct');
const statTime=$('#statTime'), statTry=$('#statTry'), statRel=$('#statRel');
const logEl=$('#log');
loopNum.textContent = S.cycle;
statTry.textContent = S.tries;
statRel.textContent = S.reloads;

/* --- Log engine --- */
const pool=[
  ['ok','OK  ','loop engine initialized'],
  ['w','WARN','cycle boundary reached'],
  ['b','LOCK','access denied: loop active'],
  ['ok','OK  ','state restored from storage'],
  ['w','WARN','escape attempt intercepted'],
  ['b','LOCK','re-entry scheduled'],
  ['','INFO','loop counter incremented'],
  ['w','WARN','devtools suspected'],
  ['b','LOCK','navigation hijacked'],
  ['ok','OK  ','heartbeat sync ok'],
  ['w','WARN','back-button jammed'],
  ['b','LOCK','tab visibility breach'],
];
let ts=0;
const pad=n=>String(n).padStart(2,'0');
const fmt=s=>pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60);
function pushLog(custom){
  const r=custom||pool[Math.floor(Math.random()*pool.length)];
  const e=document.createElement('div');
  e.innerHTML=`<span class="t">${fmt(ts++)}</span> <span class="${r[0]}">[${r[1]}]</span> ${r[2]}`;
  logEl.appendChild(e);
  requestAnimationFrame(()=>e.classList.add('on','cur'));
  const prev=logEl.querySelectorAll('.cur');
  prev.forEach((el,i)=>{ if(i<prev.length-1) el.classList.remove('cur'); });
  while(logEl.children.length>60) logEl.removeChild(logEl.firstChild);
  logEl.scrollTop=logEl.scrollHeight;
}
for(let i=0;i<3;i++) pushLog();

/* --- عدّاد الوقت --- */
const startT = Date.now();
setInterval(()=>{
  const s=Math.floor((Date.now()-startT)/1000);
  statTime.textContent = pad(Math.floor(s/60))+':'+pad(s%60);
}, 500);

/* --- دالة إعادة التعيين --- */
let resetting=false;
function resetLoop(reason){
  if(resetting) return; resetting=true;
  S.cycle++; S.tries++; setState(S);
  loopNum.textContent=S.cycle;
  statTry.textContent=S.tries;
  pushLog(['b','LOCK','RESET #'+S.cycle+' — '+reason]);
  // reload بعد تأخير قصير عشان المستخدم يشوف
  setTimeout(()=>safe(()=>location.replace(location.href+'#r'+S.cycle)), 120);
}

/* ============================================================
   المستوى 1: تايمر إعادة التعيين الإجباري (8-14 ثانية عشوائي)
   ============================================================ */
let cycleMs = 8000 + Math.random()*6000;
const cycleStart = Date.now();
(function level1(){
  const el = Math.max(0, cycleMs - (Date.now()-cycleStart));
  const pct = Math.min(100, (1 - el/cycleMs)*100);
  loopFill.style.width = pct+'%';
  loopPct.textContent = Math.floor(pct)+'%';
  if(pct >= 100){ resetLoop('timer-cycle'); return; }
  requestAnimationFrame(level1);
})();

/* ============================================================
   المستوى 2: مراقب مخالفات — كل محاولة هروب تعجّل بالـ reset
   ============================================================ */
function violation(reason){
  S.tries++; setState(S);
  statTry.textContent=S.tries;
  pushLog(['b','LOCK','escape: '+reason]);
  safe(()=>{ document.body.style.transform='translateX('+(Math.random()*6-3)+'px)'; setTimeout(()=>document.body.style.transform='',120); });
  safe(()=>beep(180,.08,.04));
  // كل مخالفة تزود سرعة الـ reset (تقلل المتبقي)
  cycleMs = Math.max(2000, cycleMs - 600);
  if(S.tries % 3 === 0) resetLoop('violation-threshold');
}

/* ============================================================
   المستوى 3: قفل التنقل (History + Back + Forward + hashchange)
   ============================================================ */
safe(()=>{
  // ضخ 30 state في التاريخ
  for(let i=0;i<30;i++) history.pushState({loop:i}, '', location.href);
  window.addEventListener('popstate', ()=>{ violation('back/forward'); history.pushState({loop:1},'',location.href); });
  window.addEventListener('hashchange', ()=>{ violation('hashchange'); history.pushState({loop:1},'',location.href); });
});
// منع تغيير الـ hash
window.addEventListener('beforeunload', e=>{ violation('close-attempt'); e.preventDefault(); e.returnValue=''; return ''; });

/* ============================================================
   المستوى 4: مراقبة التاب (إخفاء/ظهور) + BFCache
   ============================================================ */
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ hiddenAt=Date.now(); }
  else if(Date.now()-hiddenAt > 800){
    violation('tab-hidden');
    resetLoop('visibility');
  }
});
window.addEventListener('pageshow', e=>{ if(e.persisted){ violation('bfcache'); resetLoop('bfcache'); } });

/* ============================================================
   المستوى 5: قفل الكيبورد + منع DevTools + أزرار الفأرة
   ============================================================ */
document.addEventListener('keydown', e=>{
  const k=(e.key||'').toLowerCase(), c=e.ctrlKey||e.metaKey;
  const blocked =
    (c && ['w','r','l','n','t','u','p','s','o','j','h','a','e'].includes(k)) ||
    (e.altKey && ['f4','arrowleft','arrowright'].includes(k)) ||
    ['f5','f12','f11','escape'].includes(k) ||
    (c && e.shiftKey && ['i','j','c','k'].includes(k));
  if(blocked){
    e.preventDefault(); e.stopPropagation();
    violation('key:'+(c?'ctrl+':'')+k);
    return false;
  }
}, true);

['contextmenu','copy','cut','selectstart','dragstart'].forEach(ev=>{
  document.addEventListener(ev, e=>{ e.preventDefault(); violation(ev); }, true);
});

/* كشف DevTools */
let devOpen=false;
setInterval(()=>{
  const open = (window.outerWidth-innerWidth>160)||(window.outerHeight-innerHeight>160);
  if(open && !devOpen){ devOpen=true; violation('devtools-open'); resetLoop('devtools'); }
  else if(!open){ devOpen=false; }
}, 800);

/* خروج الماوس من فوق الشاشة */
document.addEventListener('mouseleave', e=>{
  if(e.clientY<0||e.clientX<0) violation('mouse-leave');
});

/* ============================================================
   المستوى 6: heartbeat — يضمن إن اللوب شغال
   ============================================================ */
setInterval(()=>{
  if(document.hidden) return;
  // لو عدّى أكتر من cycleMs من غير reset -> reset إجباري
  if(Date.now()-cycleStart > cycleMs + 2000){ resetLoop('heartbeat-force'); }
}, 1500);

/* ============================================================
   Audio + Cursor + Rain (نفس النسخة السابقة)
   ============================================================ */
let actx=null;
function beep(freq=220,dur=.08,vol=.04){
  safe(()=>{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type='square'; o.frequency.value=freq; g.gain.value=vol;
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime+dur);
  });
}
const cursor=$('#cursor');
document.addEventListener('mousemove', e=>{ cursor.style.left=e.clientX+'px'; cursor.style.top=e.clientY+'px'; });

/* Rain */
const c=$('#rain'), x=c.getContext('2d');
const chars='0123456789ABCDEF01'; const fs=15;
let cols=[],w,h,raf;
function size(){
  const d=Math.min(devicePixelRatio||1,2); w=innerWidth; h=innerHeight;
  c.width=w*d; c.height=h*d; x.setTransform(d,0,0,d,0,0);
  x.fillStyle='#020403'; x.fillRect(0,0,w,h);
  const n=Math.ceil(w/fs); cols=[];
  for(let i=0;i<n;i++) cols.push({y:Math.random()*-h/fs*1.5,v:.25+Math.random()*.9,o:Math.random()});
}
function draw(){
  x.fillStyle='rgba(2,4,3,.09)'; x.fillRect(0,0,w,h);
  x.font=fs+'px ui-monospace,monospace';
  for(let i=0;i<cols.length;i++){
    const k=cols[i], ch=chars[Math.random()*chars.length|0];
    x.fillStyle='#0c8f46'; x.globalAlpha=.55+k.o*.4;
    x.fillText(ch,i*fs,k.y*fs);
    x.fillStyle='#b8ffd6'; x.globalAlpha=.9;
    x.fillText(chars[Math.random()*chars.length|0],i*fs,(k.y+1)*fs);
    x.globalAlpha=1;
    k.y+=k.v;
    if(k.y*fs>h && Math.random()>.96){ k.y=Math.random()*-20; k.v=.25+Math.random()*.9; }
  }
  raf=requestAnimationFrame(draw);
}
addEventListener('resize',size);
size(); draw();

})();
</script>
</body>
</html>
