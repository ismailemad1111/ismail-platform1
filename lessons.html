<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FF4654" />
  <meta name="description" content="منصة أ/ إسماعيل عماد التعليمية — الدروس" />

  <title>الدروس — منصة أ/ إسماعيل عماد</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&family=Inter:wght@500;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- Project Styles -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/icons.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />

  <style>
    /* =========================================================
       PAGE BASE
       ========================================================= */
    .lessons-page {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--color-bg);
      padding-bottom: calc(var(--safe-bottom) + 90px);
    }

    /* =========================================================
       HEADER
       ========================================================= */
    .ls-header {
      position: sticky;
      top: 0;
      z-index: 50;
      padding: calc(var(--safe-top) + 16px) 16px 14px;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
    }

    .ls-header-inner {
      max-width: 720px;
      margin-inline: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .ls-title {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      color: var(--color-text);
      line-height: 1.35;
      letter-spacing: 0;
    }

    .ls-subtitle {
      margin: 4px 0 0;
      font-size: 12px;
      font-weight: 500;
      color: var(--color-text-muted);
      line-height: 1.5;
    }

    .ls-header-icon {
      flex-shrink: 0;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: var(--color-primary-light);
      font-size: 22px;
    }

    /* =========================================================
       CONTENT
       ========================================================= */
    .ls-content {
      max-width: 720px;
      margin-inline: auto;
      padding: 16px;
    }

    .ls-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* =========================================================
       LESSON CARD
       ========================================================= */
    .ls-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: 14px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .ls-card:hover {
      transform: translateY(-1px);
      border-color: #FF8B97;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.05);
    }

    .ls-card:active {
      transform: translateY(0);
    }

    .ls-card-icon {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      font-size: 20px;
      color: var(--color-primary-dark);
      background: var(--color-primary-light);
    }

    .ls-card-body {
      flex: 1;
      min-width: 0;
    }

    .ls-card-title {
      margin: 0 0 4px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0;
      color: var(--color-text);
      line-height: 1.45;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .ls-card-meta {
      margin: 0;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--color-text-muted);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .ls-card-arrow {
      flex-shrink: 0;
      font-size: 18px;
      color: var(--color-text-muted);
      opacity: 0.7;
    }

    /* =========================================================
       STATES
       ========================================================= */
    .ls-state {
      padding: 44px 20px;
      text-align: center;
      border-radius: 18px;
      background: var(--color-surface-soft);
    }

    .ls-state-icon {
      font-size: 40px;
      margin-bottom: 12px;
      line-height: 1;
    }

    .ls-state-title {
      margin: 0 0 6px;
      font-size: 16px;
      font-weight: 800;
      color: var(--color-text);
      line-height: 1.4;
    }

    .ls-state-text {
      margin: 0;
      font-size: 13px;
      font-weight: 500;
      color: var(--color-text-muted);
      line-height: 1.7;
    }

    /* Skeleton */
    .ls-skeleton {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .ls-skeleton-card {
      height: 82px;
      border-radius: 16px;
      background: linear-gradient(
        90deg,
        var(--color-surface-soft) 25%,
        var(--color-border) 50%,
        var(--color-surface-soft) 75%
      );
      background-size: 200% 100%;
      animation: ls-shimmer 1.4s ease-in-out infinite;
    }

    @keyframes ls-shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* =========================================================
       PLAYER MODAL
       ========================================================= */
    .ls-player-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0, 0, 0, 0.75);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }

    .ls-player-overlay.is-open {
      opacity: 1;
      visibility: visible;
    }

    .ls-player {
      width: 100%;
      max-width: 720px;
      background: var(--color-surface);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      transform: scale(0.96);
      transition: transform 0.2s ease;
      max-height: 92vh;
      display: flex;
      flex-direction: column;
    }

    .ls-player-overlay.is-open .ls-player {
      transform: scale(1);
    }

    .ls-player-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--color-border);
    }

    .ls-player-title {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0;
      color: var(--color-text);
      line-height: 1.4;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .ls-player-close {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--color-surface-soft);
      border: none;
      cursor: pointer;
      font-size: 20px;
      color: var(--color-text);
      transition: background-color 0.15s ease;
    }

    .ls-player-close:hover {
      background: var(--color-border);
    }

    .ls-player-body {
      position: relative;
      width: 100%;
      background: var(--color-surface, #fff);
      max-height: 80vh;
      overflow: auto;
    }

    .ls-player-body iframe {
      display: block;
      width: 100%;
      height: min(62vh, 560px);
      border: 0;
      background: #f4f4f4;
    }

    .ls-player-note {
      padding: 12px 16px;
      font-size: 12px;
      font-weight: 600;
      color: var(--color-text-muted);
      line-height: 1.6;
      border-top: 1px solid var(--color-border);
      text-align: center;
    }

    /* =========================================================
       RESPONSIVE
       ========================================================= */
    @media (min-width: 700px) {
      .ls-content {
        padding: 20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .ls-card,
            .ls-player-overlay,
      .ls-player {
        transition: none;
      }
      .ls-skeleton-card {
        animation: none;
      }
    }
  </style>
  <link rel="stylesheet" href="css/lessons-collections.css" />
  <link rel="stylesheet" href="css/screens.css" />
  <link rel="stylesheet" href="css/editorial-redesign.css" />
  <link rel="stylesheet" href="css/mascot.css" />
  <link rel="stylesheet" href="css/barai.css" />
  <link rel="stylesheet" href="css/mobile-pro.css" />
  <script src="js/fx.js" defer></script>
</head>

<body>

  <header class="ls-header">
    <div class="ls-header-inner">
      <div>
        <h1 class="ls-title" id="lsTitle">الدروس</h1>
        <p class="ls-subtitle" id="lsSubtitle">اختر المنهج وابدأ الآن</p>
      </div>
      <div class="ls-header-icon" aria-hidden="true"><span class="icon icon-video" aria-hidden="true"></span></div>
    </div>
  </header>

  <main class="ls-content">
    <div class="ls-skeleton" id="lsSkeleton">
      <div class="lc-skel"></div>
      <div class="lc-skel"></div>
    </div>

    <!-- المحتوى المتغير: مجموعات ← مجموعة ← وحدة -->
    <div id="lsView" style="display: none;"></div>

    <div class="ls-state" id="lsEmpty" style="display: none;">
      <div class="ls-state-icon" aria-hidden="true"><span class="icon icon-books" aria-hidden="true"></span></div>
      <h2 class="ls-state-title" id="lsEmptyTitle">لا توجد مناهج متاحة حاليًا</h2>
      <p class="ls-state-text">هيظهر هنا أي منهج جديد لمستر إسماعيل.</p>
    </div>

    <div class="ls-state" id="lsError" style="display: none;">
      <div class="ls-state-icon" aria-hidden="true"><span class="icon icon-warning" aria-hidden="true"></span></div>
      <h2 class="ls-state-title">تعذر تحميل الدروس</h2>
      <p class="ls-state-text">تأكد من اتصالك بالإنترنت وحاول مرة أخرى.</p>
      <button type="button" id="lsRetryBtn" style="margin-top:16px;min-height:44px;padding:0 22px;border-radius:12px;background:var(--color-blue);color:#FFFFFF;font-family:var(--font-arabic);font-size:14px;font-weight:800;border:none;cursor:pointer;box-shadow:0 4px 0 var(--color-blue-dark);">حاول مرة أخرى</button>
    </div>
  </main>

  <!-- مشغل الفيديو (مشغل المنصة الحالي) -->
  <div class="ls-player-overlay" id="lsPlayerOverlay" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="lsPlayerTitle">
    <div class="ls-player" id="lsPlayer">
      <div class="ls-player-head">
        <h2 class="ls-player-title" id="lsPlayerTitle">—</h2>
        <button type="button" class="ls-player-close" id="lsPlayerCloseBtn" aria-label="إغلاق">×</button>
      </div>
      <div class="ls-player-body" id="lsPlayerBody"></div>
      <div class="lc-player-status" id="lsPlayerStatus"></div>
      <p class="lc-player-desc" id="lsPlayerDesc"></p>
      <div class="lc-player-nav">
        <button type="button" id="lsPrevBtn">→ السابق</button>
        <button type="button" id="lsListBtn" class="is-main">قائمة الدروس</button>
        <button type="button" id="lsNextBtn">التالي ←</button>
      </div>
      <div class="ls-player-note">لو الفيديو مش شغال، تأكد من اتصالك بالإنترنت.</div>
    </div>
  </div>

  <!-- ============================================================
       Bottom Navigation Slot
       ============================================================ -->
  <div id="bottomNavSlot"></div>

  <!-- JavaScript -->
  <script type="module" src="js/lessons.js"></script>

  <script type="module" src="js/barai/index.js"></script>
</body>
</html>
