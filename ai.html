<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#04050d" />
  <meta name="description" content="منصة أ/ إسماعيل عماد التعليمية — المساعد الذكي" />

  <title>المساعد الذكي — منصة أ/ إسماعيل عماد</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Project Styles
       ملاحظة: هذه الصفحة تُحمّل فقط ما تحتاجه (tokens/base/components/layout للـ Toast والمتغيرات الأساسية،
       و mascot/barai لبرعي). قواعد .ai-* القديمة في screens.css و editorial-redesign.css و mobile-pro.css
       لم تعد تُحمَّل هنا — حلّت محلها cosmic.css المعزولة — وتبقى الملفات نفسها كما هي لبقية الصفحات. -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/icons.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/mascot.css" />
  <link rel="stylesheet" href="css/barai.css" />
  <link rel="stylesheet" href="css/cosmic.css" />
  <script src="js/fx.js" defer></script>
</head>

<body class="ci-body">

  <div class="ai-page ci-page" data-state="idle">

    <div class="ci-bg" aria-hidden="true"><span class="ci-noise"></span></div>

    <!-- ============================================================
         HEADER
         ============================================================ -->
    <header class="ai-header">
      <div class="ai-header-inner">

        <div class="ci-mark" aria-hidden="true">
          <canvas data-ci-core="mini"></canvas>
        </div>

        <div class="ai-header-meta">
          <h1 class="ai-header-title" lang="en"><span>Cosmic</span> <b>Intelligence</b></h1>
          <p class="ai-header-sub" role="status" aria-live="polite">
            <span class="ci-dot" aria-hidden="true"></span>
            <span id="aiSubtitle">متصل · جاهز لسؤالك</span>
          </p>
        </div>

        <button
          type="button"
          class="ai-new-chat-btn"
          id="newChatBtn"
          aria-label="محادثة جديدة"
        >
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 2.5v11M2.5 8h11"/></svg>
          <span>محادثة جديدة</span>
        </button>

      </div>
      <span class="ci-signal" aria-hidden="true"></span>
    </header>

    <!-- ============================================================
         CONVERSATION
         ============================================================ -->
    <main class="ai-conversation" id="aiConversation">

      <!-- Empty State — المشهد الافتتاحي -->
      <section class="ai-empty" id="aiEmpty" aria-label="بداية المحادثة">
        <div class="ci-core-stage" aria-hidden="true">
          <canvas data-ci-core="hero"></canvas>
        </div>
        <p class="ci-eyebrow" lang="en">System online</p>
        <h2 class="ai-empty-title">اتعلم بشكل جديد</h2>
        <p class="ai-empty-text">مساحة ذكية للتفكير، والفهم، واكتشاف الإجابات.</p>
        <p class="ci-status">
          <span class="ci-dot" aria-hidden="true"></span>
          <span>حالة النظام: <b id="ciStatusText">متصل · جاهز لسؤالك</b></span>
        </p>
      </section>

      <!-- Messages -->
      <div class="ai-messages" id="aiMessages" style="display: none;"></div>

    </main>

    <!-- ============================================================
         INPUT CONSOLE
         ============================================================ -->
    <div class="ai-input-area">
      <div class="ai-input-inner">

        <div class="ci-console">
          <textarea
            class="ai-input"
            id="aiInput"
            placeholder="اكتب سؤالك في العلوم..."
            rows="1"
            maxlength="2000"
            aria-label="اكتب سؤالك"
          ></textarea>

          <button
            type="button"
            class="ai-send-btn"
            id="aiSendBtn"
            aria-label="إرسال"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg>
          </button>
        </div>

        <p class="ci-console-hint">Enter للإرسال · Shift + Enter لسطر جديد</p>

      </div>
    </div>

  </div>

  <!-- ============================================================
       Bottom Nav Slot
       ============================================================ -->
  <div id="bottomNavSlot" style="display: none;"></div>

  <!-- JavaScript -->
  <script type="module" src="js/ai.js"></script>

  <script type="module" src="js/barai/index.js"></script>
</body>
</html>
